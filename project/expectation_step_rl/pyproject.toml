[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "expectation-step-rl"
version = "0.1.0"
description = "One-step GRPO from expectation deviation in tau2 trajectories"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=1.24.0",
    "tau2",
]

[project.scripts]
expectation-step-data = "expectation_step_rl.data.compiler:main"
expectation-step-preflight = "expectation_step_rl.preflight:main"
expectation-step-inference = "expectation_step_rl.evaluation.inference_cli:main"
expectation-step-official-metrics = "expectation_step_rl.evaluation.official_metrics:main"

[tool.uv.sources]
tau2 = { path = "../..", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.9.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/expectation_step_rl"]

[tool.pytest.ini_options]
pythonpath = ["src", "../.."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501", "F541"]

[tool.ruff.lint.isort]
known-first-party = ["expectation_step_rl", "tau2"]
