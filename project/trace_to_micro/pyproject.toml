[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trace-to-micro"
version = "0.1.0"
description = "Training-free pre-experiments for mining local transitions from tau2 traces"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "tau2",
]

[project.scripts]
trace-to-micro = "trace_to_micro.cli:main"

[tool.uv.sources]
tau2 = { path = "../..", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.9.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trace_to_micro"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501", "F541"]
