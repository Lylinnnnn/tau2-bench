[trajectory]
domain = "telecom"
task_set = "telecom"
task_split = "base"
agent = "llm_agent"
user = "user_simulator"
agent_llm = "openai/qwen3-32b"
user_llm = "openai/qwen3-32b"
agent_llm_args = { temperature = 0.6, top_p = 0.95, max_tokens = 4096, api_base = "http://127.0.0.1:8000/v1", api_key = "EMPTY", timeout = 180.0, num_retries = 0, extra_body = { top_k = 20, min_p = 0.0, chat_template_kwargs = { enable_thinking = true } } }
user_llm_args = { temperature = 0.6, top_p = 0.95, max_tokens = 4096, api_base = "http://127.0.0.1:8000/v1", api_key = "EMPTY", timeout = 180.0, num_retries = 0, extra_body = { top_k = 20, min_p = 0.0, chat_template_kwargs = { enable_thinking = true } } }
num_trials = 1
max_steps = 200
max_errors = 10
max_concurrency = 3
seed = 300
timeout_seconds = 1800.0
save_to = "trace_to_micro_qwen3_32b_thinking_t06_telecom_base"

[probe]
results_path = "../../data/simulations/trace_to_micro_qwen3_32b_thinking_t06_telecom_base/results.json"
output_dir = "outputs/qwen3_32b_thinking_t06_model_preexperiment"
train_split = "train"
splits = ["train", "test"]
max_snapshots_per_task = 3
support_thresholds = [1, 3, 5]
variants = ["long_raw", "structured_state", "clean_subtask"]
agent_llm = "openai/qwen3-32b"
user_llm = "openai/qwen3-32b"
context_builder_llm = "openai/qwen3-32b"
agent_llm_args = { temperature = 0.6, top_p = 0.95, max_tokens = 4096, api_base = "http://127.0.0.1:8000/v1", api_key = "EMPTY", timeout = 180.0, num_retries = 0, extra_body = { top_k = 20, min_p = 0.0, chat_template_kwargs = { enable_thinking = true } } }
user_llm_args = { temperature = 0.6, top_p = 0.95, max_tokens = 4096, api_base = "http://127.0.0.1:8000/v1", api_key = "EMPTY", timeout = 180.0, num_retries = 0, extra_body = { top_k = 20, min_p = 0.0, chat_template_kwargs = { enable_thinking = true } } }
context_builder_llm_args = { temperature = 0.0, max_tokens = 1024, response_format = { type = "json_object" }, api_base = "http://127.0.0.1:8000/v1", api_key = "EMPTY", timeout = 180.0, num_retries = 0, extra_body = { chat_template_kwargs = { enable_thinking = false } } }
seed = 300
