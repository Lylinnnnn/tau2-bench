[trajectory]
domain = "telecom"
task_set = "telecom"
task_split = "base"
agent = "llm_agent"
user = "user_simulator"
agent_llm = "openai/qwen3-30b-a3b-instruct-2507"
user_llm = "openai/qwen3-30b-a3b-instruct-2507"
agent_llm_args = { temperature = 0.0 }
user_llm_args = { temperature = 0.0 }
num_trials = 1
max_steps = 200
max_errors = 10
max_concurrency = 3
seed = 300
timeout_seconds = 1800.0
save_to = "trace_to_micro_qwen3_30b_telecom_base"

[probe]
results_path = "../../data/simulations/trace_to_micro_qwen3_30b_telecom_base/results.json"
output_dir = "outputs/qwen3_30b_model_preexperiment"
train_split = "train"
split = "test"
max_snapshots_per_task = 3
support_thresholds = [1, 3, 5]
variants = ["long_raw", "structured_state", "clean_subtask"]
agent_llm = "openai/qwen3-30b-a3b-instruct-2507"
user_llm = "openai/qwen3-30b-a3b-instruct-2507"
context_builder_llm = "openai/qwen3-30b-a3b-instruct-2507"
agent_llm_args = { temperature = 0.0 }
user_llm_args = { temperature = 0.0 }
context_builder_llm_args = { temperature = 0.0, response_format = { type = "json_object" } }
seed = 300
